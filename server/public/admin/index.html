<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacker20 Admin</title>
    <style>
      :root {
        --bg: #0b0d12;
        --card: #141821;
        --text: #f3f5f8;
        --muted: #9aa3b2;
        --border: #2a3244;
        --accent: #3f84ff;
        --danger: #ff5d73;
        --ok: #2ecc71;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }
      h1, h2 { margin: 0 0 10px; }
      h1 { font-size: 22px; }
      h2 { font-size: 18px; }
      p { margin: 6px 0; color: var(--muted); }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .row {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }
      label { font-size: 13px; color: var(--muted); }
      input, textarea, select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #0f131c;
        color: var(--text);
        padding: 10px;
        outline: none;
      }
      textarea { min-height: 120px; resize: vertical; }
      button {
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-secondary {
        background: #283145;
      }
      .log {
        white-space: pre-wrap;
        background: #0b1018;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        min-height: 56px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .ok { color: var(--ok); }
      .err { color: var(--danger); }
      .codes-list { margin-top: 10px; display: grid; gap: 8px; }
      .code-item {
        background: #0f131c;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        font-size: 13px;
      }
      @media (max-width: 880px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Hacker20 Admin</h1>
        <p>API: <span id="apiBase"></span></p>
        <div class="grid">
          <div class="row">
            <label>Admin API Key (`x-admin-key`)</label>
            <input id="adminKey" type="password" placeholder="Введите ADMIN_API_KEY" />
          </div>
          <div class="row">
            <label>Быстрая проверка</label>
            <button id="btnHealth" class="btn-secondary">Проверить /api/health</button>
          </div>
        </div>
        <div id="log" class="log"></div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Обновить ФИО/аватар по коду</h2>
          <div class="row">
            <label>Code</label>
            <input id="opCode" value="escalion" />
          </div>
          <div class="row">
            <label>Full Name</label>
            <input id="opName" value="Алексей Белинский" />
          </div>
          <div class="row">
            <label>Avatar URL</label>
            <input id="opAvatar" placeholder="https://..." />
          </div>
          <div class="row">
            <label>Template Title</label>
            <input id="opTemplateTitle" value="Samsung OneUi 8" />
          </div>
          <button id="btnUpdateProfile">Сохранить профиль</button>
        </div>

        <div class="card">
          <h2>Создать конфиг (упрощенно)</h2>
          <p>Только 4 поля: код, модель, имя, аватар. Остальное сформируется автоматически.</p>
          <div class="row">
            <label>Code</label>
            <input id="cfgCode" value="newuser01" />
          </div>
          <div class="row">
            <label>Модель UI (Template ID)</label>
            <select id="cfgTemplateId">
              <option value="samsungOneUi8">Samsung OneUi 8</option>
              <option value="onePlus">One Plus</option>
              <option value="huawei">Huawei EMUI</option>
            </select>
          </div>
          <div class="row">
            <label>Имя пользователя (Full Name)</label>
            <input id="cfgFullName" value="VladMagician" />
          </div>
          <div class="row">
            <label>Avatar URL</label>
            <input id="cfgAvatar" placeholder="https://..." />
          </div>
          <button id="btnCreateConfig">Создать конфиг</button>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Создать access-code</h2>
          <div class="row">
            <label>Code</label>
            <input id="codeValue" value="escalion" />
          </div>
          <div class="row">
            <label>Config ID</label>
            <input id="codeConfigId" placeholder="Вставь ObjectId от /admin/configs" />
          </div>
          <button id="btnCreateCode">Создать код</button>
        </div>

        <div class="card">
          <h2>Список кодов</h2>
          <button id="btnLoadCodes" class="btn-secondary">Обновить список</button>
          <div id="codesList" class="codes-list"></div>
        </div>
      </div>
    </div>

    <script>
      const apiBase = `${window.location.origin}/api`;
      document.getElementById('apiBase').textContent = apiBase;

      function log(message, ok = true) {
        const node = document.getElementById('log');
        node.className = `log ${ok ? 'ok' : 'err'}`;
        node.textContent = typeof message === 'string' ? message : JSON.stringify(message, null, 2);
      }

      function getAdminKey() {
        return document.getElementById('adminKey').value.trim();
      }

      function normalizeCode(value) {
        return String(value || '').trim().toLowerCase();
      }

      function buildTemplateTitle(templateId) {
        const key = String(templateId || '').trim().toLowerCase();
        if (key === 'oneplus' || key === 'one_plus') return 'One Plus';
        if (key === 'huawei' || key === 'huaweiemui' || key === 'emui') return 'Huawei EMUI';
        return 'Samsung OneUi 8';
      }

      function buildVersion() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}.1`;
      }

      async function api(path, options = {}, withAdmin = false) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (withAdmin) {
          const key = getAdminKey();
          if (!key) throw new Error('Введите Admin API Key');
          headers['x-admin-key'] = key;
        }
        const response = await fetch(`${apiBase}${path}`, { ...options, headers });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }
        return data;
      }

      document.getElementById('btnHealth').addEventListener('click', async () => {
        try {
          const data = await api('/health');
          log(data, true);
        } catch (error) {
          log(error.message, false);
        }
      });

      document.getElementById('btnUpdateProfile').addEventListener('click', async () => {
        try {
          const payload = {
            code: document.getElementById('opCode').value.trim(),
            fullName: document.getElementById('opName').value.trim(),
            avatarUrl: document.getElementById('opAvatar').value.trim(),
            templateTitle: document.getElementById('opTemplateTitle').value.trim(),
          };
          const data = await api('/admin/operator-profile', {
            method: 'POST',
            body: JSON.stringify(payload),
          }, true);
          log(data, true);
        } catch (error) {
          log(error.message, false);
        }
      });

      document.getElementById('btnCreateConfig').addEventListener('click', async () => {
        try {
          const code = normalizeCode(document.getElementById('cfgCode').value.trim());
          const templateId = document.getElementById('cfgTemplateId').value.trim();
          const fullName = document.getElementById('cfgFullName').value.trim();
          const avatarUrl = document.getElementById('cfgAvatar').value.trim();
          const templateTitle = buildTemplateTitle(templateId);

          if (!code) throw new Error('Введите code');
          if (!fullName) throw new Error('Введите имя пользователя');

          const payload = {
            schemaVersion: 1,
            version: buildVersion(),
            templateId,
            templateName: templateTitle,
            profile: {
              id: code,
              displayName: fullName,
            },
            payload: {
              operatorProfile: {
                fullName,
                avatarUrl,
              },
              templateMeta: {
                title: templateTitle,
              },
            },
            isActive: true,
          };
          const data = await api('/admin/configs', {
            method: 'POST',
            body: JSON.stringify(payload),
          }, true);
          if (data.id) {
            document.getElementById('codeConfigId').value = data.id;
            document.getElementById('codeValue').value = code;
            document.getElementById('opCode').value = code;
            document.getElementById('opName').value = fullName;
            document.getElementById('opAvatar').value = avatarUrl;
            document.getElementById('opTemplateTitle').value = templateTitle;
          }
          log(data, true);
        } catch (error) {
          log(error.message, false);
        }
      });

      document.getElementById('btnCreateCode').addEventListener('click', async () => {
        try {
          const payload = {
            code: document.getElementById('codeValue').value.trim(),
            configId: document.getElementById('codeConfigId').value.trim(),
          };
          const data = await api('/admin/access-codes', {
            method: 'POST',
            body: JSON.stringify(payload),
          }, true);
          log(data, true);
        } catch (error) {
          log(error.message, false);
        }
      });

      document.getElementById('btnLoadCodes').addEventListener('click', async () => {
        const holder = document.getElementById('codesList');
        holder.innerHTML = '';
        try {
          const data = await api('/admin/access-codes', {}, true);
          const items = Array.isArray(data.items) ? data.items : [];
          if (!items.length) {
            holder.innerHTML = '<div class="code-item">Нет записей</div>';
            return;
          }
          items.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'code-item';
            div.textContent = `last4=${item.codeLast4 || ''} | status=${item.status} | template=${item.config?.templateId || '-'} | version=${item.config?.version || '-'}`;
            holder.appendChild(div);
          });
        } catch (error) {
          log(error.message, false);
        }
      });
    </script>
  </body>
</html>
