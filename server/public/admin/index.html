<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacker20 Admin</title>
    <style>
      :root {
        --bg: #0b0d12;
        --card: #141821;
        --text: #f3f5f8;
        --muted: #9aa3b2;
        --border: #2a3244;
        --accent: #3f84ff;
        --danger: #ff5d73;
        --ok: #2ecc71;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }
      h1, h2 { margin: 0 0 10px; }
      h1 { font-size: 22px; }
      h2 { font-size: 18px; }
      p { margin: 6px 0; color: var(--muted); }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .row {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }
      label { font-size: 13px; color: var(--muted); }
      input, textarea, select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #0f131c;
        color: var(--text);
        padding: 10px;
        outline: none;
      }
      textarea { min-height: 120px; resize: vertical; }
      button {
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-secondary {
        background: #283145;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .log {
        white-space: pre-wrap;
        background: #0b1018;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        min-height: 56px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .ok { color: var(--ok); }
      .err { color: var(--danger); }
      .codes-list { margin-top: 10px; display: grid; gap: 8px; }
      .code-item {
        background: #0f131c;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        font-size: 13px;
      }
      @media (max-width: 880px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Hacker20 Admin</h1>
        <p>API: <span id="apiBase"></span></p>
        <div class="grid">
          <div class="row">
            <label>Admin API Key (`x-admin-key`)</label>
            <input id="adminKey" type="password" placeholder="Введите ADMIN_API_KEY" />
          </div>
          <div class="row">
            <label>Быстрая проверка</label>
            <button id="btnHealth" class="btn-secondary">Проверить /api/health</button>
          </div>
        </div>
        <div id="log" class="log"></div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Обновить ФИО/аватар по коду</h2>
          <div class="row">
            <label>Пользователь</label>
            <select id="opUserSelect">
              <option value="">Сначала нажмите "Обновить список"</option>
            </select>
          </div>
          <div class="row">
            <label>Full Name</label>
            <input id="opName" value="" />
          </div>
          <div class="row">
            <label>Avatar URL</label>
            <input id="opAvatar" placeholder="https://..." />
          </div>
          <div class="row">
            <label>Template Title</label>
            <input id="opTemplateTitle" value="" />
          </div>
          <button id="btnUpdateProfile" disabled>Сохранить профиль</button>
        </div>

        <div class="card">
          <h2>Создать конфиг (упрощенно)</h2>
          <p>Только 4 поля: код, модель, имя, аватар. Остальное сформируется автоматически.</p>
          <div class="row">
            <label>Code</label>
            <input id="cfgCode" value="newuser01" />
          </div>
          <div class="row">
            <label>Модель UI (Template ID)</label>
            <select id="cfgTemplateId">
              <option value="samsungOneUi8">Samsung OneUi 8</option>
              <option value="onePlus">One Plus</option>
              <option value="huawei">Huawei EMUI</option>
            </select>
          </div>
          <div class="row">
            <label>Имя пользователя (Full Name)</label>
            <input id="cfgFullName" value="VladMagician" />
          </div>
          <div class="row">
            <label>Avatar URL</label>
            <input id="cfgAvatar" placeholder="https://..." />
          </div>
          <button id="btnCreateConfig">Создать конфиг и привязать code</button>
        </div>
      </div>

      <div class="card">
        <h2>Список кодов</h2>
        <button id="btnLoadCodes" class="btn-secondary">Обновить список</button>
        <div id="codesList" class="codes-list"></div>
      </div>
    </div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
